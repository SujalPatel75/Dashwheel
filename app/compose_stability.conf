// Compose stability configuration (wired in app/build.gradle.kts, composeCompiler block).
//
// Classes listed here are treated as stable by the Compose compiler: a composable
// taking one is skipped when the new value equals() the previous one, instead of
// only when it is the very same instance (strong skipping, on by default in Kotlin 2).
// Only list types that are never mutated in place once handed to the UI.

// Album art and other pictures: Bitmap equals() is identity, so this only lets
// classes holding one (MediaState) be inferred stable.
android.graphics.Bitmap

// Read-only collection interfaces. Every list/map the UI receives is replaced,
// not mutated, when it changes.
kotlin.collections.*

java.util.Date
java.util.Locale

// The phone link protocol (:link module, compiled without the Compose compiler).
// Its messages are data classes of vals only. The stateful helpers there
// (VideoWindow, LinkSession, VideoPacket) are never composable parameters.
com.openauto.dash.link.**

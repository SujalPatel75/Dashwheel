# Project-wide Gradle settings.

# JVM memory for the Gradle daemon and the Kotlin compiler. The app's looks
# grew past what 2 GB compiles: CI ran out of memory on :app:compile*Kotlin.
# CI machines have 16 GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# Build in parallel and cache where possible.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin/AndroidX configuration.
android.useAndroidX=true
kotlin.code.style=official

# Generate per-module R classes (smaller, faster).
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
